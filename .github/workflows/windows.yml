# Builds the Windows app. A Mac cannot build for Windows, so this is the only
# way a Windows download gets made.
#
# - On a published release: attaches Personal-<tag>-Windows.zip to it.
# - Run by hand (Actions → Windows build → Run workflow): the zip is kept as a
#   workflow artifact, to try a build before releasing.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      # ⚠ Flutter apps need the MSVC runtime. Most PCs already have it, but a
      # fresh install does not, and it fails to launch with a missing-DLL
      # dialog. Shipping the three DLLs next to the exe costs about 1 MB.
      - name: Bundle the MSVC runtime
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$dll" $out
          }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.release.tag_name }}") { "${{ github.event.release.tag_name }}" } else { "dev" }
          $name = "Personal-$tag-Windows.zip"
          # A folder inside the zip, so unzipping does not scatter DLLs.
          Rename-Item "build\windows\x64\runner\Release" "Personal"
          Compress-Archive -Path "build\windows\x64\runner\Personal" -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: app/${{ steps.zip.outputs.name }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.zip.outputs.name }}" --clobber
